[project]
name = "coordfs"
version = "0.1.0"
description = "Filesystem-backed coordination board and mirrored coord CLI."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
coord = "coordfs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coordfs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
